kind = "mobile"
previewPath = "/payonce-vtu/"
title = "PayOnce VTU"
description = "A polished Nigerian mobile VTU prototype for buying airtime and data, paying utility bills, funding a wallet, tracking transactions, and managing referrals with realistic local demo data."
version = "1.0.0"
id = "artifacts/payonce-vtu"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/payonce-vtu/" ]
localPort = 25692

[services.development]
run = "pnpm --filter @workspace/payonce-vtu run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/payonce-vtu", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/payonce-vtu", "run", "serve" ]

[services.env]
PORT = "25692"
BASE_PATH = "/payonce-vtu/"
